name: Windows Offline CI (AI Limits 1.1)

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  ANTHROPIC_API_KEY: ''
  OPENAI_API_KEY: ''
  KIMI_API_KEY: ''
  GEMINI_API_KEY: ''
  GOOGLE_API_KEY: ''

jobs:
  limits-windows-offline:
    name: Offline Build, Package & Updater Validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python for offline schema/contract checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned schema validator dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r telemetry/tests/requirements.txt

      - name: Prepare isolated CI artifact directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ciRoot = Join-Path $env:RUNNER_TEMP ('limits-ci-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $ciRoot) { Remove-Item -LiteralPath $ciRoot -Recurse -Force }
          New-Item -ItemType Directory -Path (Join-Path $ciRoot 'logs') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $ciRoot 'quotas-harness') -Force | Out-Null
          "CI_ARTIFACTS_ROOT=$ciRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run offline AI Telemetry contract unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logFile = Join-Path $env:CI_ARTIFACTS_ROOT 'logs/telemetry-contract-tests.log'
          python -m unittest discover -s telemetry/tests -v 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) { throw "Telemetry contract tests failed with exit code $LASTEXITCODE" }

      - name: Run offline Quotas Publisher harness & schema validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:CI_ARTIFACTS_ROOT 'quotas-harness'
          $logFile = Join-Path $env:CI_ARTIFACTS_ROOT 'logs/quotas-publisher-harness.log'
          & .\telemetry\publisher-tests\quotas\run.ps1 -OutDir $outDir 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) { throw "Quotas publisher harness failed with exit code $LASTEXITCODE" }

      - name: Run offline core widget unit/regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $coreTestRunner = 'windows\limits-widget\tests\run.ps1'
          if (Test-Path -LiteralPath $coreTestRunner -PathType Leaf) {
            $logFile = Join-Path $env:CI_ARTIFACTS_ROOT 'logs/core-widget-tests.log'
            $coreOut = Join-Path $env:CI_ARTIFACTS_ROOT 'core-tests'
            & .\windows\limits-widget\tests\run.ps1 -OutDir $coreOut 2>&1 | Tee-Object -FilePath $logFile
            if ($LASTEXITCODE -ne 0) { throw "Core widget tests failed with exit code $LASTEXITCODE" }
          }

      - name: Build AI Limits 1.1.0 release package (scoped Limits mode)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:CI_ARTIFACTS_ROOT 'release'
          $logFile = Join-Path $env:CI_ARTIFACTS_ROOT 'logs/build-limits-release.log'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-limits-release.ps1 -OutputDirectory $releaseDir 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE" }

      - name: Validate release archive, manifest, headless smoke & reversible updater lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:CI_ARTIFACTS_ROOT 'release'
          $resultsDir = Join-Path $env:CI_ARTIFACTS_ROOT 'test-results'
          $logFile = Join-Path $env:CI_ARTIFACTS_ROOT 'logs/test-limits-release.log'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-limits-release.ps1 -ArtifactsDirectory $releaseDir -ResultsDirectory $resultsDir 2>&1 | Tee-Object -FilePath $logFile
          if ($LASTEXITCODE -ne 0) { throw "Release validation failed with exit code $LASTEXITCODE" }

      - name: Upload reviewable release & validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limits-widget-1.1.0-ci-artifacts
          if-no-files-found: error
          path: |
            ${{ env.CI_ARTIFACTS_ROOT }}/release/LimitsWidget-1.1.0-win-x64.zip
            ${{ env.CI_ARTIFACTS_ROOT }}/release/SHA256SUMS.txt
            ${{ env.CI_ARTIFACTS_ROOT }}/test-results/limits-release-validation.json
            ${{ env.CI_ARTIFACTS_ROOT }}/test-results/validation.txt
            ${{ env.CI_ARTIFACTS_ROOT }}/test-results/limits-widget-dump.json
            ${{ env.CI_ARTIFACTS_ROOT }}/test-results/limits-updater-scratch/*-receipt.json
            ${{ env.CI_ARTIFACTS_ROOT }}/quotas-harness/case-*.json
            ${{ env.CI_ARTIFACTS_ROOT }}/logs/*.log
